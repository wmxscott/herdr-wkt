name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: brew install bats-core
      - name: Test
        run: bats test
      - name: Smoke test
        run: |
          bin/wkt --version | grep -x 'wkt [0-9.]*'
          bin/wkt --help | head -1 | grep -x 'Usage: wkt <command> \[options\]'

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: zsh syntax
        run: zsh -n bin/wkt
      - name: ShellCheck the tests
        run: shellcheck test/*.bats test/*.bash
      - name: Formula syntax
        run: ruby -c contrib/wkt.rb

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
